<radialGradient id="plate"><stop stop-color="#faf4e6"/><stop offset=".75" stop-color="#eae1cf"/><stop offset="1" stop-color="#b7a38e"/></radialGradient>
<linearGradient id="bread" x2=".9" y2="1"><stop stop-color="#efc887"/><stop offset=".6" stop-color="#db9d5b"/><stop offset="1" stop-color="#b87940"/></linearGradient>
<linearGradient id="meat" x2=".8" y2=".9"><stop stop-color="#935038"/><stop offset=".52" stop-color="#6c3827"/><stop offset="1" stop-color="#3c241d"/></linearGradient>
<radialGradient id="sauce"><stop stop-color="#fffefa"/><stop offset="1" stop-color="#eee7d6"/></radialGradient>
