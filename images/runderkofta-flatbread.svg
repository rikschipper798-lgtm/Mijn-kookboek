<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" width="1200" height="780" role="img" aria-labelledby="title desc">
<title id="title">Runderkofta op flatbread met frisse groenten en yoghurtsaus</title>
<desc id="desc">Warme huiselijke vectorillustratie van zes langwerpige gegrilde runderkofta op twee flatbreads, met komkommer, tomaat, sla en een schaaltje knoflook-yoghurtsaus.</desc>
<defs>
