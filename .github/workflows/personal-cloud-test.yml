name: Test persoonlijke kookboekcloud
on:
  push:
    branches:
      - feature/persoonlijke-gegevens-cloudsync-2026-11-10
  workflow_dispatch:
permissions:
  contents: read
jobs:
  personal-cloud:
    name: Test accountkoppeling, migratie en bestaande functies
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Controleer syntax
        run: |
          node --check personal-cloud.js
          node --check pantry.js
          node --check sw.js
      - name: Test persoonlijke cloud
        run: node --test tests/personal-cloud.test.cjs
      - name: Regressietests bestaande website
        run: |
          node --test tests/pantry.test.cjs
          node --test tests/personal-experience.test.cjs
          node --test tests/cloud-diary.test.cjs
          node --test tests/backup-database.test.cjs
      - name: Installeer testbrowser
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test twee browsers met lokale nepaccountgegevens
        run: node tests/personal-cloud-browser.cjs
      - name: Bewaar schermafbeeldingen en testresultaten
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: persoonlijke-cloud-browser
          path: persoonlijke-cloud-testresultaten/
          if-no-files-found: warn
