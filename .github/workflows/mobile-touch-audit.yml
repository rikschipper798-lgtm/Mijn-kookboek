name: Audit mobiele aanraakvlakken
on:
  push:
    branches:
      - improve/mobile-touch-targets-2026-11-10
  workflow_dispatch:
permissions:
  contents: read
jobs:
  touch:
    name: Chromium controle mobiele aanraakvlakken
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Installatie testbrowser
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Meet mobiele knoppen en responsive schermen
        run: node tests/mobile-touch-targets.cjs
      - name: Bewaar meetresultaten
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-touch-audit
          path: mobile-touch-audit/
          if-no-files-found: warn
