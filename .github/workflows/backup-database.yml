name: Versleutelde databaseback-up

# Eerste versleutelde databaseback-up geslaagd op 9 november 2026.
# Dagelijkse back-up om 03.17 UTC; handmatige uitvoering blijft mogelijk.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  encrypted-backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_BACKUP_DB_URL: ${{ secrets.SUPABASE_BACKUP_DB_URL }}
      BACKUP_ENCRYPTION_KEY_BASE64: ${{ secrets.BACKUP_ENCRYPTION_KEY_BASE64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Controleer of de twee vereiste GitHub Secrets zijn ingesteld
        id: config
        shell: bash
        run: |
          if [[ -n "$SUPABASE_BACKUP_DB_URL" && -n "$BACKUP_ENCRYPTION_KEY_BASE64" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::error::GEEN BACK-UP GEMAAKT: stel beide repositorysecrets in volgens supabase/BACKUP-AUTOMATION.md."
            exit 1
          fi

      - name: Controleer encryptiesleutel en verbinding
        if: steps.config.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node -e "const x=process.env.BACKUP_ENCRYPTION_KEY_BASE64||''; if(!/^[A-Za-z0-9+/]{43}=$/.test(x)||Buffer.from(x,'base64').length!==32){ console.error('Encryptiesleutel is ongeldig.'); process.exit(1); }"
          if [[ "$SUPABASE_BACKUP_DB_URL" != postgresql://* && "$SUPABASE_BACKUP_DB_URL" != postgres://* ]]; then
            echo "::error::De databaseverbinding moet een PostgreSQL connection string zijn."
            exit 1
          fi
          # Toon nooit de URI of het wachtwoord in logs. Controleer alleen de
          # structuur van de Session Pooler-identiteit voordat pg_dump start.
          node <<'NODE'
          const raw=process.env.SUPABASE_BACKUP_DB_URL||'';
          let parsed;
          try{parsed=new URL(raw);}
          catch{console.error('::error::De PostgreSQL-URI is ongeldig. Kopieer de volledige Session Pooler URI uit Supabase > Connect.');process.exit(1);}
          if(parsed.hostname.endsWith('.pooler.supabase.com')){
            if(parsed.username==='postgres'){
              console.error('::error::De Session Pooler verwacht postgres.usppeputwknbxayekufe in plaats van postgres. Kopieer de Session Pooler URI uit Supabase > Connect opnieuw.');
              process.exit(1);
            }
            if(parsed.port!=='5432'){
              console.error('::error::Kies de Session Pooler op poort 5432 (niet Transaction Pooler 6543).');
              process.exit(1);
            }
          }
          if(!parsed.password||parsed.password.includes('YOUR-PASSWORD')||parsed.password.includes('%5B')){
            console.error('::error::Vul het echte databasewachtwoord in de URI in; laat geen [YOUR-PASSWORD]-placeholder staan.');
            process.exit(1);
          }
          NODE

      - name: Maak een streaming PostgreSQL-dump en versleutel deze
        id: backup
        if: steps.config.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/kookboek-backup"
          backup="$RUNNER_TEMP/kookboek-backup/mijn-kookboek-$(date -u +%Y%m%dT%H%M%SZ).mkbak"
          docker run --rm --network=host \
            -e SUPABASE_BACKUP_DB_URL \
            postgres:17.11 \
            sh -ec 'exec pg_dump -d "$SUPABASE_BACKUP_DB_URL" --format=custom --no-owner --no-privileges --schema=public --schema=auth --schema=storage' \
            | node scripts/backup-database.cjs encrypt - "$backup"
          node scripts/backup-database.cjs verify "$backup"

          # Controleer ook of de ontsleutelde inhoud een leesbaar PostgreSQL-
          # archief is. Dit is nog geen volledige restore in een testdatabase.
          plaintext="$RUNNER_TEMP/kookboek-backup/pg-archive-verify.dump"
          cleanup() {
            if [[ -f "$plaintext" ]]; then
              shred --remove "$plaintext" 2>/dev/null || rm -f "$plaintext"
            fi
          }
          trap cleanup EXIT
          node scripts/backup-database.cjs decrypt "$backup" "$plaintext" >/dev/null
          docker run --rm \
            -v "$RUNNER_TEMP/kookboek-backup:/backup:ro" \
            postgres:17.11 \
            pg_restore --list /backup/pg-archive-verify.dump >/dev/null
          cleanup
          trap - EXIT

          echo "path=$backup" >> "$GITHUB_OUTPUT"
          echo "size_bytes=$(stat -c '%s' "$backup")" >> "$GITHUB_OUTPUT"

      - name: Bewaar alleen het versleutelde bestand buiten Supabase
        if: steps.config.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mijn-kookboek-versleutelde-db-${{ github.run_id }}
          path: ${{ steps.backup.outputs.path }}
          retention-days: 30
          if-no-files-found: error
          compression-level: 0

      - name: Bevestig gereedmelding
        if: steps.config.outputs.ready == 'true'
        run: echo "De versleutelde databaseback-up is gemaakt en als GitHub Actions-artifact opgeslagen. Bewaar de decryptiesleutel afzonderlijk."
