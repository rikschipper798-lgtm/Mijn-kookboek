name: Controleer kookboekrecepten

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Receptvalidatie
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Node.js instellen
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regressietests uitvoeren
        run: node --test tests/validate-recipes.test.cjs
      - name: Offline afbeeldingen en synchronisatie testen
        run: node --test tests/offline-images.test.cjs
      - name: Gekoppelde basisrecepten testen
        run: node --test tests/component-recipes.test.cjs
      - name: Persoonlijke voorraad en back-ups testen
        run: node --test tests/pantry.test.cjs
      - name: Receptversies en wijzigingsgeschiedenis testen
        run: node --test tests/recipe-revisions.test.cjs
      - name: Persoonlijke beoordelingen en kookervaringen testen
        run: node --test tests/personal-experience.test.cjs
      - name: Recepten en afbeeldingen controleren
        run: node scripts/validate-recipes.cjs
      - name: Receptversies tegen vorige Git-versie controleren
        run: node scripts/check-recipe-revisions.cjs
