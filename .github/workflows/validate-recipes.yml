name: Controleer kookboekrecepten

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Receptvalidatie
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Node.js instellen
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regressietests uitvoeren
        run: node --test tests/validate-recipes.test.cjs
      - name: Hoeveelheden in bereidingsstappen testen
        run: node --test tests/recipe-scaling.test.cjs
      - name: Offline afbeeldingen en synchronisatie testen
        run: node --test tests/offline-images.test.cjs
      - name: Gekoppelde basisrecepten testen
        run: node --test tests/component-recipes.test.cjs
      - name: Persoonlijke voorraad en back-ups testen
        run: node --test tests/pantry.test.cjs
      - name: Receptversies en wijzigingsgeschiedenis testen
        run: node --test tests/recipe-revisions.test.cjs
      - name: Persoonlijke beoordelingen en kookervaringen testen
        run: node --test tests/personal-experience.test.cjs
      - name: Receptgroepen en filters testen
        run: node --test tests/recipe-types.test.cjs
      - name: Voedingswaarden en porties testen
        run: node --test tests/nutrition.test.cjs
      - name: Accountisolatie en synchronisatie van voedingsdagboek testen
        run: node --test tests/cloud-diary.test.cjs
      - name: Accountbeveiliging, herstelgeschiedenis en privacy testen
        run: node --test tests/cloud-governance.test.cjs
      - name: Versleutelde dagboekback-ups testen
        run: node --test tests/secure-backup.test.cjs
      - name: Versleutelde onafhankelijke databaseback-ups testen
        run: node --test tests/backup-database.test.cjs
      - name: JavaScript-syntax van cloudmodules controleren
        run: |
          node --check voeding-cloud.js
          node --check cloud-config.js
      - name: Recepten en afbeeldingen controleren
        run: node scripts/validate-recipes.cjs
      - name: Receptversies tegen vorige Git-versie controleren
        run: node scripts/check-recipe-revisions.cjs


  portions-browser:
    name: Porties in browser en offline
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Browser installeren
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Recepten, kookmodus, kopiëren en offline testen
        run: node tests/recipe-scaling-browser.cjs
