name: Browsergebruikstest back-up en herstel

on:
  push:
    branches:
      - test/backup-herstel-2026-11-10
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recovery:
    name: Veilig herstel met synthetische gegevens
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Code ophalen
        uses: actions/checkout@v4
      - name: Node instellen
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Testbrowser installeren
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Herstelproeven uitvoeren (geen echte accounts)
        run: node tests/backup-recovery-browser.cjs
      - name: Testresultaten opslaan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: herstel-gebruikerstest
          path: herstel-testresultaten/
          if-no-files-found: warn
