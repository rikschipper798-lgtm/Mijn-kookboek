name: Synchronisatietest meerdere apparaten

on:
  push:
    branches:
      - test/meerdere-apparaten-sync-2026-11-10
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync-browser:
    name: Twee apparaten, offline, conflict en accountisolatie
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Code ophalen
        uses: actions/checkout@v4
      - name: Node.js instellen
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Chromium installeren
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Browsergebruikstests met twee gesimuleerde apparaten
        run: node tests/sync-multi-device-browser.cjs
      - name: Resultaten bewaren
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sync-testresultaten
          path: sync-testresultaten/
          if-no-files-found: warn
