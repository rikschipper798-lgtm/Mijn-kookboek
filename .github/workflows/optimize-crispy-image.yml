name: Optimize crispy chicken image
run-name: Optimize oversized cookbook image to WebP
on:
  push:
    paths:
      - '.github/workflows/optimize-crispy-image.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize-image:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Prepare Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install --quiet Pillow==11.3.0
      - name: Convert to WebP and update recipe data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image

          source = Path('images/broodje-crispy-kipschnitzel-sriracha-mayo.png')
          target = source.with_suffix('.webp')
          if not source.exists():
              raise SystemExit('Original photo missing; conversion aborted')
          with Image.open(source) as image:
              image = image.convert('RGB')
              image.thumbnail((1400, 1050), Image.Resampling.LANCZOS)
              image.save(target, 'WEBP', quality=82, method=6)
          if target.stat().st_size >= source.stat().st_size:
              raise SystemExit('WebP not smaller than original')
          if target.stat().st_size > 500_000:
              raise SystemExit('Image still too large; keep original')
          path = Path('recepten.json')
          recipes = json.loads(path.read_text(encoding='utf-8'))
          recipe = next((r for r in recipes if r.get('id') == 'broodje-crispy-kipschnitzel-sriracha-mayo'), None)
          if recipe is None:
              raise SystemExit('Recipe missing')
          recipe['image'] = target.as_posix()
          path.write_text(json.dumps(recipes, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print('Optimized image:', target.stat().st_size, 'bytes; original:', source.stat().st_size)
          PY
      - name: Commit optimized image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add beelden-niet-bestaand 2>/dev/null || true
          git add images/broodje-crispy-kipschnitzel-sriracha-mayo.webp recepten.json
          if ! git diff --cached --quiet; then
            git commit -m "Optimize crispy chicken image as lightweight WebP"
            git push origin HEAD:main
          fi
