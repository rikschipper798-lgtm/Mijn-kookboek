<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f7f3eb">
<meta name="description" content="Mijn Kookboek: persoonlijke recepten, boodschappenlijsten en kookinstructies.">
<title>Mijn Kookboek — alle recepten</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#28392e;background:#f8f5ed;--green:#294935;--leaf:#53704e;--clay:#b16e42;--line:#e5dfd2}
*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}a{color:inherit}
.top{background:linear-gradient(125deg,#243e2d,#466347);color:#fff;padding:36px max(22px,calc((100vw - 1120px)/2)) 38px}
.kicker{letter-spacing:.15em;text-transform:uppercase;font-size:11px;font-weight:750;color:#e4bc91}
.top h1{font-family:Georgia,serif;font-weight:500;font-size:clamp(39px,7vw,64px);line-height:1.1;margin:8px 0}
.top p{font-size:16px;color:#e2e9dd;margin:8px 0 0}
.wrap{max-width:1120px;margin:auto;padding:28px 22px 70px}
.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:0 0 17px}
.search{flex:1;min-width:220px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;color:#26382b}
select{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;color:#26382b}
.pill{border-radius:30px;border:1px solid #c8d4c4;background:#eef3e9;color:#294935;padding:8px 13px;font-weight:650}
.pill[aria-pressed=true]{background:#294935;color:white}
.count{color:#69776b;margin:0 0 22px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:19px}
.card{border:1px solid var(--line);background:#fff;border-radius:17px;overflow:hidden;box-shadow:0 5px 20px #34403410;display:flex;flex-direction:column}
.card-art{min-height:125px;display:grid;place-items:center;background:linear-gradient(130deg,#e0e8d7,#f7e6cf);font-size:48px}.card-art.with-photo{display:block;overflow:hidden}.card-art img{display:block;width:100%;height:188px;object-fit:cover}.hero-photo{display:block;width:100%;max-height:470px;object-fit:cover;border-radius:14px;margin:0 0 18px}
.card-body{padding:19px;flex:1;display:flex;flex-direction:column;gap:8px}
.eyebrow{font-size:11px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;color:#a36c43}
.card h2{font-family:Georgia,serif;font-size:23px;font-weight:500;line-height:1.2;margin:0}
.card p{font-size:14px;color:#68746b;line-height:1.5;margin:0;flex:1}
.meta{display:flex;flex-wrap:wrap;gap:7px;margin:9px 0}
.tag{font-size:12px;background:#f0f3ed;color:#465b45;padding:6px 9px;border-radius:30px}
.card-actions{display:flex;align-items:center;gap:8px}
.btn{background:var(--green);border:0;color:white;text-decoration:none;border-radius:10px;padding:11px 16px;font-weight:700;display:inline-block}
.btn.alt{background:#e9eee5;color:#294935}
.card-actions .btn{flex:1;text-align:center}
.fav{border:1px solid #d9d9cf;background:white;border-radius:10px;min-width:43px;height:42px;font-size:19px;color:#8a8d84}
.fav.active{color:#bd5337;background:#fff0ed}
.details{background:white;border:1px solid var(--line);border-radius:18px;padding:clamp(18px,4vw,40px);box-shadow:0 9px 28px #33443513}
.back{background:transparent;border:0;color:#3d6347;font-weight:750;padding:4px 0 24px}
.details h2{font-family:Georgia,serif;font-size:clamp(30px,5vw,43px);font-weight:500;margin:10px 0}
.description{font-size:17px;line-height:1.65;color:#5f6d61}
.details .meta{margin:18px 0 25px}
.actions{display:flex;flex-wrap:wrap;gap:9px;margin:25px 0}
.columns{display:grid;grid-template-columns:1fr 1fr;gap:36px}
h3{font-family:Georgia,serif;font-size:24px;font-weight:500;margin:26px 0 13px}
.ingredients{padding:0;list-style:none}
.ingredients li{display:flex;justify-content:space-between;gap:14px;padding:10px 0;border-bottom:1px solid #eeece4}
.ingredients strong{text-align:right;white-space:nowrap}
.steps{list-style:none;padding:0}
.steps li{display:flex;gap:16px;margin:0 0 19px;line-height:1.65}
.num{flex:0 0 33px;height:33px;border-radius:50%;background:#e7eee1;display:grid;place-items:center;font-weight:800}
.steps li>div{padding-top:3px}
.note{background:#f7f1e7;border-left:3px solid #b68055;border-radius:9px;padding:15px 18px;line-height:1.6}
.shop label{display:block;padding:10px 0;border-bottom:1px solid #eee;cursor:pointer;line-height:1.4}
.shop input{margin-right:8px;accent-color:#2c5940}
.shop input:checked+span{text-decoration:line-through;color:#90988e}
.servings{display:flex;align-items:center;gap:10px;margin:15px 0}
.servings button{border:1px solid #cdd9ca;background:#eef3e9;border-radius:8px;width:34px;height:34px}
.error{padding:25px;background:#fff4ed;border-radius:12px}
footer{text-align:center;color:#6f786f;font-size:13px;padding:0 20px 30px}
[hidden]{display:none!important}
@media(max-width:650px){.columns{grid-template-columns:1fr;gap:0}.top{padding:31px 22px}.wrap{padding:22px 15px 48px}.card-art{min-height:110px}.toolbar select{width:100%}}
@media print{.top,.back,.actions,.toolbar,.count,.cards,footer{display:none!important}.wrap{padding:0}.details{box-shadow:none;border:0;padding:0}.shop{display:none}}
</style>
</head>
<body>
<header class="top"><div class="kicker">Met liefde gemaakt</div><h1>Mijn Kookboek</h1><p>Van doordeweeks makkelijk tot uitgebreid koken. Alle favorieten op één plek.</p></header>
<main class="wrap">
<section id="overview">
<div class="toolbar"><input id="search" class="search" type="search" placeholder="Zoek op gerecht, ingrediënt of keuken…" aria-label="Zoek recepten"><select id="category" aria-label="Categorie"><option value="">Alle categorieën</option></select><button id="favorites" class="pill" aria-pressed="false">♡ Favorieten</button></div>
<p class="count" id="count">Recepten laden…</p><div id="cards" class="cards"></div>
</section>
<article id="detail" class="details" hidden></article>
</main>
<footer>Mijn Kookboek · Bewaren, koken en delen</footer>
<script>
'use strict';
const el=id=>document.getElementById(id);
const safe=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const number=x=>Number(x)||0;
const fmt=n=>new Intl.NumberFormat('nl-NL',{maximumFractionDigits:2}).format(n);
let recipes=[],favoriteOnly=false;
let favorites;try{favorites=new Set(JSON.parse(localStorage.getItem('mijn-kookboek-favorieten')||'[]'))}catch(e){favorites=new Set()}
function saveFavorites(){try{localStorage.setItem('mijn-kookboek-favorieten',JSON.stringify([...favorites]))}catch(e){}}
function title(r){return r.title||'Onbekend recept'}
function description(r){return r.description||r.subtitle||''}
function portions(r){return number(r.portions||r.servings)||2}
function duration(r){return number(r.total_minutes||r.minutes)||0}
function emoji(r){const t=(r.category+' '+r.title).toLowerCase();if(t.includes('brood')||t.includes('bruschetta'))return '🥖';if(t.includes('pasta')||t.includes('gnocchi')||t.includes('bolognese'))return '🍝';if(t.includes('wrap')||t.includes('arayes')||t.includes('gyros'))return '🌯';if(t.includes('zalm')||t.includes('vis'))return '🐟';if(t.includes('rijst'))return '🍚';if(t.includes('stoof')||t.includes('goulash'))return '🍲';if(t.includes('burger'))return '🍔';if(t.includes('pesto'))return '🌿';return '🍽️'}
function ingredients(r){return Array.isArray(r.ingredients)?r.ingredients:[]}
function amount(i,mult){if(i.quantity!==undefined)return String(i.quantity);if(i.qty!==undefined){let n=Number(i.qty);return (Number.isFinite(n)?fmt(n*mult):i.qty)+(i.unit?' '+i.unit:'')}return ''}
function herbs(r){return Array.isArray(r.herbs)?r.herbs:[]}
function toggleFav(id){if(favorites.has(id))favorites.delete(id);else favorites.add(id);saveFavorites();renderCards();if(!el('detail').hidden)renderDetail()}
function renderCards(){
const term=el('search').value.toLowerCase().trim(),cat=el('category').value;
const shown=recipes.filter(r=>(!cat||r.category===cat)&&(!favoriteOnly||favorites.has(r.id))&&(!term||[r.title,description(r),r.category,...ingredients(r).map(i=>i.name)].join(' ').toLowerCase().includes(term)));
el('count').textContent=shown.length+' van '+recipes.length+' recepten';
el('cards').innerHTML=shown.map(r=>'<div class="card">'+(r.image?'<div class="card-art with-photo"><img loading="lazy" src="'+safe(r.image)+'" alt="'+safe(title(r))+'"></div>':'<div class="card-art" aria-hidden="true">'+emoji(r)+'</div>')+'<div class="card-body"><div class="eyebrow">'+safe(r.category||'Recept')+'</div><h2>'+safe(title(r))+'</h2><p>'+safe(description(r))+'</p><div class="meta"><span class="tag">'+portions(r)+' personen</span><span class="tag">'+(duration(r)||'–')+' min.</span></div><div class="card-actions"><a class="btn" href="#recept/'+encodeURIComponent(r.id)+'">Bekijk recept</a><button class="fav '+(favorites.has(r.id)?'active':'')+'" aria-label="Favoriet aanpassen" data-fav="'+safe(r.id)+'">'+(favorites.has(r.id)?'♥':'♡')+'</button></div></div></div>').join('')||'<p>Geen recepten gevonden. Probeer een andere zoekterm.</p>';
document.querySelectorAll('#cards [data-fav]').forEach(b=>b.addEventListener('click',()=>toggleFav(b.dataset.fav)));
}
function shopping(i,mult){return '<label><input type="checkbox"><span>'+safe(i.name)+' — '+safe(amount(i,mult))+'</span></label>'}
function row(i,mult){return '<li><span>'+safe(i.name)+'</span><strong>'+safe(amount(i,mult))+'</strong></li>'}
function textRecipe(r,mult){
return title(r)+'\n\nIngrediënten:\n'+ingredients(r).map(i=>'- '+amount(i,mult)+' '+i.name).join('\n')+(herbs(r).length?'\n\nKruiden:\n'+herbs(r).map(i=>'- '+amount(i,mult)+' '+i.name).join('\n'):'')+'\n\nBereiding:\n'+(r.steps||[]).map((s,i)=>(i+1)+'. '+(typeof s==='string'?s:((s.title||'')+': '+(s.body||'')))).join('\n\n');
}
function renderDetail(){
const id=decodeURIComponent(location.hash.slice(8));const r=recipes.find(x=>x.id===id);if(!r){location.hash='';return}
el('overview').hidden=true;el('detail').hidden=false;
const isNumeric=ingredients(r).some(x=>typeof x.qty==='number');const original=portions(r);
const chosen=number(el('detail').dataset.currentServings);
const current=el('detail').dataset.recipeId===r.id&&chosen?chosen:original;
el('detail').dataset.recipeId=r.id;el('detail').dataset.currentServings=current;
const mult=current/original;
const ingredientRows=ingredients(r).map(i=>row(i,mult)).join('');
const herbRows=herbs(r).map(i=>row(i,mult)).join('');
const steps=(r.steps||[]).map((s,i)=>'<li><span class="num">'+(i+1)+'</span><div>'+(typeof s==='string'?safe(s):'<strong>'+safe(s.title||'Stap '+(i+1))+'</strong>'+(s.duration?' <small>('+safe(s.duration)+')</small>':'')+'<div>'+safe(s.body||'')+'</div>')+'</div></li>').join('');
const tips=(typeof r.tips==='string'?[r.tips]:r.tips)||[];
const remarks=[...tips,...(r.portions_note?[r.portions_note]:[])];
el('detail').innerHTML='<button class="back" id="back">← Alle recepten</button><div class="eyebrow">'+safe(r.category||'Recept')+'</div><h2>'+safe(title(r))+'</h2><p class="description">'+safe(description(r))+'</p>'+(r.image?'<img class="hero-photo" src="'+safe(r.image)+'" alt="'+safe(title(r))+'">':'')+'<div class="meta"><span class="tag">'+original+' personen</span><span class="tag">'+(duration(r)||'–')+' minuten</span><span class="tag">'+safe(r.difficulty||'')+'</span></div><div class="actions"><button class="btn" id="copy">Kopieer recept</button><button class="btn alt" id="whatsapp">Deel via WhatsApp</button><button class="btn alt" id="print">Print</button><button class="btn alt" id="favorite">'+(favorites.has(r.id)?'♥ Favoriet':'♡ Bewaar favoriet')+'</button></div>'+(isNumeric?'<div class="servings">Aantal personen <button id="minus" aria-label="Minder personen">−</button><strong>'+current+'</strong><button id="plus" aria-label="Meer personen">+</button></div>':'')+'<div class="columns"><section><h3>Ingrediënten</h3><ul class="ingredients">'+ingredientRows+'</ul>'+(herbRows?'<h3>Kruiden</h3><ul class="ingredients">'+herbRows+'</ul>':'')+'</section><section><h3>Boodschappenlijst</h3><p class="count">Vink de ingrediënten af die je al in huis hebt.</p><div class="shop">'+ingredients(r).map(i=>shopping(i,mult)).join('')+'</div></section></div><h3>Bereiding</h3><ol class="steps">'+steps+'</ol>'+(remarks.length?'<h3>Kooktips</h3><div class="note">'+remarks.map(x=>'<p>'+safe(x)+'</p>').join('')+'</div>':'');
el('back').onclick=()=>location.hash='';
el('favorite').onclick=()=>toggleFav(r.id);
el('copy').onclick=async()=>{const t=textRecipe(r,mult);try{await navigator.clipboard.writeText(t);el('copy').textContent='Gekopieerd'}catch(e){prompt('Kopieer recept',t)}};
el('whatsapp').onclick=()=>{location.href='https://wa.me/?text='+encodeURIComponent(textRecipe(r,mult))};
el('print').onclick=()=>window.print();
if(isNumeric){el('minus').onclick=()=>{el('detail').dataset.currentServings=Math.max(1,current-1);renderDetail()};el('plus').onclick=()=>{el('detail').dataset.currentServings=current+1;renderDetail()}}
document.title=title(r)+' | Mijn Kookboek';
}
function route(){if(location.hash.startsWith('#recept/'))renderDetail();else{el('detail').hidden=true;el('detail').dataset.recipeId='';el('overview').hidden=false;document.title='Mijn Kookboek — alle recepten';renderCards()}window.scrollTo(0,0)}
el('search').addEventListener('input',renderCards);
el('category').addEventListener('change',renderCards);
el('favorites').onclick=()=>{favoriteOnly=!favoriteOnly;el('favorites').setAttribute('aria-pressed',favoriteOnly);renderCards()};
window.addEventListener('hashchange',route);
fetch('recepten.json',{cache:'no-cache'}).then(r=>{if(!r.ok)throw Error('Kan recepten niet laden');return r.json()}).then(data=>{if(!Array.isArray(data))throw Error('Ongeldige recepten');recipes=data;[...new Set(data.map(x=>x.category||'Overig'))].sort((a,b)=>a.localeCompare(b,'nl')).forEach(c=>el('category').add(new Option(c,c)));route()}).catch(e=>{el('count').innerHTML='<span class="error">De recepten konden niet worden geladen. Probeer de pagina opnieuw.</span>';console.error(e)});
</script>
</body>
</html>
