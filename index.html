<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f7f3eb">
<meta name="description" content="Mijn Kookboek: persoonlijke recepten, boodschappenlijsten en kookinstructies.">
<title>Mijn Kookboek — alle recepten</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#28392e;background:#f8f5ed;--green:#294935;--leaf:#53704e;--clay:#b16e42;--line:#e5dfd2}
*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}a{color:inherit}
.top{background:linear-gradient(125deg,#243e2d,#466347);color:#fff;padding:36px max(22px,calc((100vw - 1120px)/2)) 38px}
.kicker{letter-spacing:.15em;text-transform:uppercase;font-size:11px;font-weight:750;color:#e4bc91}
.top h1{font-family:Georgia,serif;font-weight:500;font-size:clamp(39px,7vw,64px);line-height:1.1;margin:8px 0}
.top p{font-size:16px;color:#e2e9dd;margin:8px 0 0}
.wrap{max-width:1120px;margin:auto;padding:28px 22px 70px}
.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:0 0 17px}
.search{flex:1;min-width:220px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;color:#26382b}
select{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;color:#26382b}
.pill{border-radius:30px;border:1px solid #c8d4c4;background:#eef3e9;color:#294935;padding:8px 13px;font-weight:650}
.pill[aria-pressed=true]{background:#294935;color:white}.variants{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin:18px 0}.variants strong{font-size:13px;margin-right:6px}
.count{color:#69776b;margin:0 0 22px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:19px}
.card{border:1px solid var(--line);background:#fff;border-radius:17px;overflow:hidden;box-shadow:0 5px 20px #34403410;display:flex;flex-direction:column}
.card-art{min-height:125px;display:grid;place-items:center;background:linear-gradient(130deg,#e0e8d7,#f7e6cf);font-size:48px}.card-art.with-photo{display:block;overflow:hidden}.card-art img{display:block;width:100%;height:188px;object-fit:cover}.hero-photo{display:block;width:100%;max-height:470px;object-fit:cover;border-radius:14px;margin:0 0 18px}
.card-body{padding:19px;flex:1;display:flex;flex-direction:column;gap:8px}
.eyebrow{font-size:11px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;color:#a36c43}
.card h2{font-family:Georgia,serif;font-size:23px;font-weight:500;line-height:1.2;margin:0}
.card p{font-size:14px;color:#68746b;line-height:1.5;margin:0;flex:1}
.meta{display:flex;flex-wrap:wrap;gap:7px;margin:9px 0}
.tag{font-size:12px;background:#f0f3ed;color:#465b45;padding:6px 9px;border-radius:30px}
.card-actions{display:flex;align-items:center;gap:8px}
.btn{background:var(--green);border:0;color:white;text-decoration:none;border-radius:10px;padding:11px 16px;font-weight:700;display:inline-block}
.btn.alt{background:#e9eee5;color:#294935}
.card-actions .btn{flex:1;text-align:center}
.fav{border:1px solid #d9d9cf;background:white;border-radius:10px;min-width:43px;height:42px;font-size:19px;color:#8a8d84}
.fav.active{color:#bd5337;background:#fff0ed}
.details{background:white;border:1px solid var(--line);border-radius:18px;padding:clamp(18px,4vw,40px);box-shadow:0 9px 28px #33443513}
.back{background:transparent;border:0;color:#3d6347;font-weight:750;padding:4px 0 24px}
.details h2{font-family:Georgia,serif;font-size:clamp(30px,5vw,43px);font-weight:500;margin:10px 0}
.description{font-size:17px;line-height:1.65;color:#5f6d61}
.details .meta{margin:18px 0 25px}
.actions{display:flex;flex-wrap:wrap;gap:9px;margin:25px 0}
.columns{display:grid;grid-template-columns:1fr 1fr;gap:36px}
h3{font-family:Georgia,serif;font-size:24px;font-weight:500;margin:26px 0 13px}
.ingredients{padding:0;list-style:none}
.ingredients li{display:flex;justify-content:space-between;gap:14px;padding:10px 0;border-bottom:1px solid #eeece4}
.ingredients strong{text-align:right;white-space:nowrap}
.ingredients .ingredient-heading{display:block;font-weight:750;color:#294935;background:#eef3e9;border-radius:7px;padding:8px 10px;margin-top:15px}
.ingredients .ingredient-heading:first-child{margin-top:0}
.shop-group{font-weight:750;color:#294935;padding:8px 0 3px;margin-top:11px}
.basket-recipe{display:flex;align-items:center;justify-content:space-between;gap:15px;border-bottom:1px solid var(--line);padding:8px 0}
.basket-recipe .btn{padding:8px 12px}
.scale-note{font-size:13px;color:#735631;background:#fbf5e8;padding:10px 13px;border-radius:8px;line-height:1.5}
.time-breakdown{padding:15px 18px;background:#f3f5ee;border:1px solid #dce4d7;border-radius:12px;margin:15px 0 25px}
.time-breakdown h3{font-size:22px;margin:0 0 10px}
.time-breakdown dl{margin:0}
.time-breakdown dl>div{display:flex;justify-content:space-between;align-items:baseline;gap:14px;padding:7px 0;border-bottom:1px solid #dfe6d9}
.time-breakdown dt{color:#526352}
.time-breakdown dd{margin:0;text-align:right;font-weight:650}
.time-breakdown p{font-size:13px;line-height:1.5;color:#586959;margin:12px 0 0}
@media(max-width:500px){.time-breakdown dl>div{align-items:flex-start;flex-direction:column;gap:2px}.time-breakdown dd{text-align:left}}
.servings button:disabled{opacity:.4;cursor:not-allowed}
@media(max-width:650px){.basket-recipe{align-items:flex-start;flex-direction:column}}

.steps{list-style:none;padding:0}
.steps li{display:flex;gap:16px;margin:0 0 19px;line-height:1.65}
.num{flex:0 0 33px;height:33px;border-radius:50%;background:#e7eee1;display:grid;place-items:center;font-weight:800}
.steps li>div{padding-top:3px}
.note{background:#f7f1e7;border-left:3px solid #b68055;border-radius:9px;padding:15px 18px;line-height:1.6}
.shop label{display:block;padding:10px 0;border-bottom:1px solid #eee;cursor:pointer;line-height:1.4}
.shop input{margin-right:8px;accent-color:#2c5940}
.shop input:checked+span{text-decoration:line-through;color:#90988e}
.servings{display:flex;align-items:center;gap:10px;margin:15px 0}
.servings button{border:1px solid #cdd9ca;background:#eef3e9;border-radius:8px;width:34px;height:34px}
.error{padding:25px;background:#fff4ed;border-radius:12px}
footer{text-align:center;color:#6f786f;font-size:13px;padding:0 20px 30px}
[hidden]{display:none!important}
@media(max-width:650px){.columns{grid-template-columns:1fr;gap:0}.top{padding:31px 22px}.wrap{padding:22px 15px 48px}.card-art{min-height:110px}.toolbar select{width:100%}}
@media print{.top,.back,.actions,.toolbar,.count,.cards,footer,.variants,.servings{display:none!important}.wrap{padding:0}.details{box-shadow:none;border:0;padding:0}.shop{display:none}}
</style>
</head>
<body>
<header class="top"><div class="kicker">Met liefde gemaakt</div><h1>Mijn Kookboek</h1><p>Van doordeweeks makkelijk tot uitgebreid koken. Alle favorieten op één plek.</p></header>
<main class="wrap">
<section id="overview">
<div class="toolbar"><input id="search" class="search" type="search" placeholder="Zoek op gerecht, ingrediënt of keuken…" aria-label="Zoek recepten"><select id="category" aria-label="Categorie"><option value="">Alle categorieën</option></select><button id="favorites" class="pill" aria-pressed="false">♡ Favorieten</button><button id="shoppingNav" class="pill">Boodschappenlijst (<span id="basketCount">0</span>)</button></div>
<p class="count" id="count">Recepten laden…</p><div id="cards" class="cards"></div>
</section>
<article id="detail" class="details" hidden></article>
<section id="basket" class="details" hidden></section>
</main>
<footer>Mijn Kookboek · Bewaren, koken en delen</footer>
<script>
'use strict';
const el=id=>document.getElementById(id);
const safe=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const number=x=>Number(x)||0;
const fmt=n=>new Intl.NumberFormat('nl-NL',{maximumFractionDigits:3}).format(n);
const STORAGE={fav:'mijn-kookboek-favorieten',checked:'mijn-kookboek-receptchecks',basket:'mijn-kookboek-boodschappen',basketChecked:'mijn-kookboek-boodschappenchecks'};
function load(k,defaultValue){try{const v=JSON.parse(localStorage.getItem(k));return v&&typeof v==='object'?v:defaultValue}catch(e){return defaultValue}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
let recipes=[],favoriteOnly=false;
let favorites=new Set(Array.isArray(load(STORAGE.fav,[]))?load(STORAGE.fav,[]):[]);
let checked=load(STORAGE.checked,{}),basket=load(STORAGE.basket,{}),basketChecked=load(STORAGE.basketChecked,{});
function title(r){return r.title||'Onbekend recept'}
function description(r){return r.description||r.subtitle||''}
function portions(r){return number(r.servings||r.portions)||2}
function duration(r){return number(r.minutes||r.total_minutes)||0}
function unitLabel(r,n){
 const u=r.servingUnit||'personen';
 if(u==='personen')return n===1?'persoon':'personen';
 if(u==='stokbroden')return n===1?'stokbrood':'stokbroden';
 return u;
}
function portionsLabel(r,n){return fmt(n)+' '+unitLabel(r,n)}
function timeInfo(r){
 // De standaardduur bevat alle bereidingsstappen, ook de rijstijden van brood.
 // Alleen expliciete externe marineer- en rustperiodes komen bovenop die duur.
 const base=duration(r),marinate=number(r.marinateMinutes),rest=number(r.restMinutes);
 return {total:base+marinate+rest,base,marinate,rest,active:number(r.activeMinutes),coldRise:number(r.coldRiseMinutes),finalProof:number(r.finalProofMinutes),estimated:Boolean(r.totalTimeEstimated)};
}
function niceTime(n){if(!n)return '–';return n<60?n+' min':Math.floor(n/60)+' uur'+(n%60?' '+n%60+' min':'')}
function rangeTime(low,high){
 if(low>=60&&high>=60&&low%60===0&&high%60===0)return low/60+'–'+high/60+' uur';
 return low+'–'+high+' min';
}
function timeBadges(r){
 const t=timeInfo(r);
 return ['<span class="tag">'+(t.estimated?'ca. ':'')+niceTime(t.total)+' totaal</span>',t.marinate?'<span class="tag">'+t.marinate+' min marineren</span>':'',t.rest?'<span class="tag">'+t.rest+' min rusten</span>':'',t.coldRise?'<span class="tag">'+niceTime(t.coldRise)+' nachtrijs</span>':'',t.finalProof?'<span class="tag">'+niceTime(t.finalProof)+' narijzen</span>':'',t.active?'<span class="tag">'+t.active+' min actief</span>':''].join('');
}
function timeBreakdown(r){
 if(!number(r.coldRiseMinutes))return '';
 const early=number(r.initialRestMinutes),cold=number(r.coldRiseMinutes),proof=number(r.finalProofMinutes),cool=number(r.coolMinutes);
 const typical=number(r.prep)+early+cold+proof+number(r.cook)+cool;
 const preferredMin=number(r.coldRiseRecommendedMinMinutes),preferredMax=number(r.coldRiseRecommendedMaxMinutes);
 const min=number(r.coldRiseMinimumMinutes),proofMin=number(r.finalProofMinMinutes),proofMax=number(r.finalProofMaxMinutes);
 const coldRange=preferredMin&&preferredMax?rangeTime(preferredMin,preferredMax):niceTime(cold);
 const proofRange=proofMin&&proofMax?rangeTime(proofMin,proofMax):niceTime(proof);
 const parts=[['Actieve voorbereiding',niceTime(number(r.prep))],['Eerste rust (2 × 20 min)',niceTime(early)],['Nachtrijs in de koelkast',coldRange+(min?' (minimaal '+niceTime(min)+')':'')],['Narijzen',proofRange],['Bakken in de oven',niceTime(number(r.cook))],['Afkoelen',niceTime(cool)]];
 return '<section class="time-breakdown"><h3>Tijdsverdeling</h3><dl>'+parts.map(([label,value])=>'<div><dt>'+safe(label)+'</dt><dd>'+safe(value)+'</dd></div>').join('')+'</dl><p>De totale tijd is circa '+safe(niceTime(typical))+', bij '+safe(niceTime(cold))+' nachtrijs en '+safe(niceTime(proof))+' narijzen. Bij langer of korter rijzen verandert de werkelijke tijd. Deze perioden zijn al in de totale tijd opgenomen.</p></section>';
}
function emoji(r){
 const t=(r.category+' '+r.title).toLowerCase();
 if(t.includes('brood')||t.includes('bruschetta'))return '🥖';
 if(t.includes('pasta')||t.includes('gnocchi')||t.includes('bolognese'))return '🍝';
 if(t.includes('wrap')||t.includes('arayes')||t.includes('gyros'))return '🌯';
 if(t.includes('zalm')||t.includes('vis'))return '🐟';
 if(t.includes('rijst'))return '🍚';
 if(t.includes('stoof')||t.includes('goulash'))return '🍲';
 if(t.includes('burger'))return '🍔';
 if(t.includes('pesto'))return '🌿';
 return '🍽️';
}
function ingredients(r){return Array.isArray(r.ingredients)?r.ingredients:[]}
function allIngredients(r){return [...ingredients(r),...(Array.isArray(r.herbs)?r.herbs:[])]}
function fmtQty(n,u){
 if(!Number.isFinite(n))return '';
 if(['g','kg','ml','l'].includes((u||'').toLowerCase()))return fmt(n);
 if(Math.abs(n-Math.round(n))<0.012)return String(Math.round(n));
 const whole=Math.floor(n),part=n-whole;
 const fractions=[[0.125,'⅛'],[0.25,'¼'],[1/3,'⅓'],[0.5,'½'],[2/3,'⅔'],[0.75,'¾'],[0.875,'⅞']];
 const hit=fractions.find(f=>Math.abs(f[0]-part)<0.012);
 return hit?(whole?String(whole):'')+hit[1]:fmt(n);
}
function displayUnit(u,n){
 const plural={stuk:'stuks',teentje:'teentjes',plantje:'plantjes',blaadje:'blaadjes',plak:'plakken',snee:'sneetjes',blad:'bladen',portie:'porties'};
 const singular={stuks:'stuk',teentjes:'teentje',plantjes:'plantje',blaadjes:'blaadje',plakken:'plak',sneetjes:'snee',bladen:'blad',porties:'portie'};
 return n<=1?(singular[u]||u):(plural[u]||u);
}
function amount(i,mult){
 if(i.qty===null)return i.unit||'naar smaak';
 if(i.qty!==undefined){
  const n=Number(i.qty);
  const unit=Number.isFinite(n)?displayUnit(i.unit||'',n*mult):i.unit||'';
  return (Number.isFinite(n)?fmtQty(n*mult,i.unit):String(i.qty))+(unit?' '+unit:'');
 }
 return i.quantity!==undefined?String(i.quantity):'';
}
function groups(list){
 const m=new Map();
 list.forEach((item,index)=>{const g=item.group||'Overig';if(!m.has(g))m.set(g,[]);m.get(g).push({item,index})});
 return [...m];
}
function groupedRows(list,mult){
 return groups(list).map(([g,arr])=>'<li class="ingredient-heading">'+safe(g)+'</li>'+arr.map(({item})=>'<li><span>'+safe(item.name)+(item.optional?' <small>(optioneel)</small>':'')+'</span><strong>'+safe(amount(item,mult))+'</strong></li>').join('')).join('');
}
function listKey(id,variant){return id+':'+variant}
function shoppingRows(list,mult,key){
 const state=new Set(Array.isArray(checked[key])?checked[key]:[]);
 return groups(list).map(([g,arr])=>'<div class="shop-group">'+safe(g)+'</div>'+arr.map(({item,index})=>'<label><input type="checkbox" data-item="'+index+'"'+(state.has(index)?' checked':'')+'><span>'+safe(item.name)+(item.optional?' (optioneel)':'')+' — '+safe(amount(item,mult))+'</span></label>').join('')).join('');
}
function viewFor(r,variant){
 const v=(r.variants||[]).find(x=>x.id===variant);
 return v?{...r,...v,title:r.title+' — '+v.label}:{...r,title:r.variants?.length?r.title+' — '+(r.defaultVariantLabel||'Klassieke basilico'):r.title};
}
function findRecipe(id){return recipes.find(r=>r.id===id||(r.aliases||[]).includes(id))}
function basketCount(){el('basketCount').textContent=Object.keys(basket).length}
function toggleFav(id){
 if(favorites.has(id))favorites.delete(id);else favorites.add(id);
 save(STORAGE.fav,[...favorites]);renderCards();
 if(!el('detail').hidden)renderDetail();
}
function searchable(r){
 return [title(r),description(r),r.category,r.defaultVariantLabel||'',...allIngredients(r).map(x=>x.name),...(r.variants||[]).flatMap(v=>[v.label,description(v),...allIngredients(v).map(x=>x.name)])].join(' ').toLowerCase();
}
function renderCards(){
 const term=el('search').value.toLowerCase().trim(),cat=el('category').value;
 const shown=recipes.filter(r=>(!cat||r.category===cat)&&(!favoriteOnly||favorites.has(r.id))&&(!term||searchable(r).includes(term)));
 el('count').textContent=shown.length+' van '+recipes.length+' recepten';
 el('cards').innerHTML=shown.map(r=>'<div class="card">'+(r.image?'<div class="card-art with-photo"><img loading="lazy" src="'+safe(r.image)+'" alt="'+safe(title(r))+'"></div>':'<div class="card-art" aria-hidden="true">'+emoji(r)+'</div>')+'<div class="card-body"><div class="eyebrow">'+safe(r.category||'Recept')+'</div><h2>'+safe(title(r))+'</h2><p>'+safe(description(r))+'</p><div class="meta"><span class="tag">'+safe(portionsLabel(r,portions(r)))+'</span><span class="tag">'+(timeInfo(r).estimated?'ca. ':'')+niceTime(timeInfo(r).total)+'</span></div><div class="card-actions"><a class="btn" href="#recept/'+encodeURIComponent(r.id)+'">Bekijk recept</a><button class="fav '+(favorites.has(r.id)?'active':'')+'" aria-label="Favoriet aanpassen" data-fav="'+safe(r.id)+'">'+(favorites.has(r.id)?'♥':'♡')+'</button></div></div></div>').join('')||'<p>Geen recepten gevonden. Probeer een andere zoekterm.</p>';
 document.querySelectorAll('#cards [data-fav]').forEach(b=>b.addEventListener('click',()=>toggleFav(b.dataset.fav)));
 basketCount();
}
function recipeText(r,mult){
 return title(r)+'\n\nIngrediënten:\n'+allIngredients(r).map(i=>'- '+amount(i,mult)+' '+i.name+(i.optional?' (optioneel)':'')).join('\n')+'\n\nBereiding:\n'+(r.steps||[]).map((s,i)=>(i+1)+'. '+(typeof s==='string'?s:(s.title||'')+': '+(s.body||''))).join('\n\n');
}
async function copyText(text,button){
 try{await navigator.clipboard.writeText(text);if(button)button.textContent='Gekopieerd'}
 catch(e){window.prompt('Kopieer de tekst',text)}
}
function normalizedUnit(u){
 return ({stuk:'stuks',teentje:'teentjes',plantje:'plantjes',blaadje:'blaadjes',plak:'plakken',snee:'sneetjes',blad:'bladen'})[u]||u||'';
}
function basketItems(){
 const m=new Map();
 for(const entry of Object.values(basket)){
  if(!entry||!entry.id)continue;
  const r=recipes.find(x=>x.id===entry.id);if(!r)continue;
  const view=viewFor(r,entry.variantId),mult=Math.max(1,number(entry.servings))/portions(view);
  for(const i of allIngredients(view)){
   const unit=normalizedUnit(i.unit),key=i.name.trim().toLowerCase()+'|'+unit;
   if(!m.has(key))m.set(key,{key,name:i.name,unit,qty:0,numeric:false,text:false,optional:true});
   const v=m.get(key);v.optional=v.optional&&Boolean(i.optional);
   if(i.qty===null){v.text=true;continue}
   const qty=Number(i.qty);
   if(Number.isFinite(qty)){v.qty+=qty*mult;v.numeric=true}else v.text=true;
  }
 }
 return [...m.values()].sort((a,b)=>a.name.localeCompare(b.name,'nl'));
}
function basketAmount(i){return i.numeric?amount({qty:i.qty,unit:i.unit},1):i.text?(i.unit||'naar smaak'):''}
function renderBasket(){
 el('overview').hidden=true;el('detail').hidden=true;el('basket').hidden=false;
 document.title='Boodschappenlijst | Mijn Kookboek';
 const selected=Object.entries(basket).map(([key,e])=>{
  const r=recipes.find(x=>x.id===e.id);
  if(!r)return '';
  const name=title(viewFor(r,e.variantId));
  return '<div class="basket-recipe"><span>'+safe(name)+' — '+safe(portionsLabel(r,e.servings))+'</span><button class="btn alt" data-remove="'+safe(key)+'" aria-label="Verwijder '+safe(name)+'">Verwijder</button></div>';
 }).join('');
 const list=basketItems();
 el('basket').innerHTML='<button class="back" id="backBasket">← Alle recepten</button><h2>Boodschappenlijst</h2><p class="description">Ingrediënten van meerdere recepten worden opgeteld als naam en eenheid overeenkomen. De lijst blijft op dit apparaat bewaard.</p>'+(selected?'<h3>Gekozen recepten</h3>'+selected+'<div class="actions"><button class="btn" id="copyBasket">Kopieer boodschappen</button><button class="btn alt" id="clearBasket">Maak lijst leeg</button></div><h3>Benodigdheden</h3><div class="shop basket-shop">'+list.map(i=>'<label><input type="checkbox" data-basket-item="'+safe(i.key)+'"'+(basketChecked[i.key]?' checked':'')+'><span>'+safe(i.name)+(i.optional?' (optioneel)':'')+' — '+safe(basketAmount(i))+'</span></label>').join('')+'</div>':'<p>Je lijst is nog leeg. Open een recept en kies ‘Voeg toe aan boodschappenlijst’.</p>');
 el('backBasket').onclick=()=>location.hash='';
 el('basket').querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{delete basket[b.dataset.remove];save(STORAGE.basket,basket);basketCount();renderBasket()});
 el('basket').querySelectorAll('[data-basket-item]').forEach(b=>b.onchange=()=>{basketChecked[b.dataset.basketItem]=b.checked;save(STORAGE.basketChecked,basketChecked)});
 if(selected){
  el('copyBasket').onclick=()=>copyText(list.filter(i=>!basketChecked[i.key]).map(i=>'- '+basketAmount(i)+' '+i.name+(i.optional?' (optioneel)':'')).join('\n')||'Alles afgevinkt.',el('copyBasket'));
  el('clearBasket').onclick=()=>{if(window.confirm('Alle recepten uit de lijst verwijderen?')){basket={};basketChecked={};save(STORAGE.basket,basket);save(STORAGE.basketChecked,basketChecked);basketCount();renderBasket()}};
 }
}
function renderDetail(){
 const id=decodeURIComponent(location.hash.slice(8)),r=findRecipe(id);
 if(!r){location.hash='';return}
 const baseVariant=id==='bolognese'?'romig':'klassiek';
 const variantId=el('detail').dataset.routeId===id?(el('detail').dataset.variantId||baseVariant):baseVariant;
 const view=viewFor(r,variantId),original=portions(view),prior=number(el('detail').dataset.currentServings);
 const current=el('detail').dataset.recipeId===r.id&&prior?prior:original;
 el('detail').dataset.recipeId=r.id;el('detail').dataset.routeId=id;el('detail').dataset.variantId=variantId;el('detail').dataset.currentServings=current;
 el('overview').hidden=true;el('basket').hidden=true;el('detail').hidden=false;
 const mult=current/original,items=allIngredients(view),key=listKey(r.id,variantId);
 const canScale=items.some(i=>typeof i.qty==='number');
 const choices=r.variants?.length?'<div class="variants"><strong>Bereidingsvariant</strong>'+[{id:'klassiek',label:r.defaultVariantLabel||'Klassieke basilico'},...r.variants].map(v=>'<button class="pill" type="button" data-variant="'+safe(v.id)+'" aria-pressed="'+(v.id===variantId)+'">'+safe(v.label)+'</button>').join('')+'</div>':'';
 const steps=(view.steps||[]).map((s,i)=>'<li><span class="num">'+(i+1)+'</span><div>'+(typeof s==='string'?safe(s):'<strong>'+safe(s.title||'Stap '+(i+1))+'</strong>'+(s.duration?' <small>('+safe(s.duration)+')</small>':'')+'<div>'+safe(s.body||'')+'</div>')+'</div></li>').join('');
 const tips=typeof view.tips==='string'?[view.tips]:(view.tips||[]);
 const remarks=[...tips,...(view.portions_note?[view.portions_note]:[])];
 const scaleNote=current!==original?'<p class="scale-note">De ingrediënten zijn aangepast. Vaste hoeveelheden in de bereidingsstappen kunnen nog uitgaan van de oorspronkelijke portie.</p>':'';
 el('detail').innerHTML='<button class="back" id="back">← Alle recepten</button><div class="eyebrow">'+safe(view.category||'Recept')+'</div><h2>'+safe(title(view))+'</h2><p class="description">'+safe(description(view))+'</p>'+(view.image?'<img class="hero-photo" src="'+safe(view.image)+'" alt="'+safe(title(view))+'">':'')+'<div class="meta"><span class="tag">'+safe(portionsLabel(view,original))+'</span>'+timeBadges(view)+'<span class="tag">'+safe(view.difficulty||'')+'</span></div>'+timeBreakdown(view)+choices+'<div class="actions"><button class="btn" id="copy">Kopieer recept</button><button class="btn alt" id="whatsapp">Deel via WhatsApp</button><button class="btn alt" id="print">Print</button><button class="btn alt" id="favorite">'+(favorites.has(r.id)?'♥ Favoriet':'♡ Bewaar favoriet')+'</button><button class="btn alt" id="addBasket">Voeg toe aan boodschappenlijst</button><button class="btn alt" id="goBasket">Bekijk boodschappenlijst</button></div>'+(canScale?'<div class="servings"><span>Aantal '+safe(unitLabel(view,current))+'</span><button id="minus" aria-label="Minder"'+(current<=1?' disabled':'')+'>−</button><strong>'+current+'</strong><button id="plus" aria-label="Meer">+</button></div>':'')+scaleNote+'<div class="columns"><section><h3>Ingrediënten</h3><ul class="ingredients">'+groupedRows(items,mult)+'</ul></section><section><h3>Boodschappenlijst voor dit recept</h3><p class="count">Vink af wat je al hebt. Je keuzes blijven bewaard.</p><div class="shop">'+shoppingRows(items,mult,key)+'</div></section></div><h3>Bereiding</h3><ol class="steps">'+steps+'</ol>'+(remarks.length?'<h3>Kooktips</h3><div class="note">'+remarks.map(x=>'<p>'+safe(x)+'</p>').join('')+'</div>':'');
 el('back').onclick=()=>location.hash='';
 el('favorite').onclick=()=>toggleFav(r.id);
 el('detail').querySelectorAll('[data-variant]').forEach(b=>b.onclick=()=>{el('detail').dataset.variantId=b.dataset.variant;renderDetail()});
 el('detail').querySelectorAll('[data-item]').forEach(b=>b.onchange=()=>{
  const marked=new Set(Array.isArray(checked[key])?checked[key]:[]),idx=number(b.dataset.item);
  if(b.checked)marked.add(idx);else marked.delete(idx);
  checked[key]=[...marked];save(STORAGE.checked,checked);
 });
 el('copy').onclick=()=>copyText(recipeText(view,mult),el('copy'));
 el('whatsapp').onclick=()=>location.href='https://wa.me/?text='+encodeURIComponent(recipeText(view,mult));
 el('print').onclick=()=>window.print();
 el('addBasket').onclick=()=>{
  basket[listKey(r.id,variantId)]={id:r.id,variantId,servings:current};
  save(STORAGE.basket,basket);basketCount();el('addBasket').textContent='Toegevoegd / bijgewerkt';
 };
 el('goBasket').onclick=()=>location.hash='#boodschappenlijst';
 if(canScale){
  el('minus').onclick=()=>{el('detail').dataset.currentServings=Math.max(1,current-1);renderDetail()};
  el('plus').onclick=()=>{el('detail').dataset.currentServings=current+1;renderDetail()};
 }
 document.title=title(view)+' | Mijn Kookboek';
}
function route(){
 if(location.hash==='#boodschappenlijst')renderBasket();
 else if(location.hash.startsWith('#recept/'))renderDetail();
 else{el('detail').hidden=true;el('basket').hidden=true;el('detail').dataset.recipeId='';el('detail').dataset.routeId='';el('overview').hidden=false;document.title='Mijn Kookboek — alle recepten';renderCards()}
 window.scrollTo(0,0);
}
el('search').addEventListener('input',renderCards);
el('category').addEventListener('change',renderCards);
el('favorites').onclick=()=>{favoriteOnly=!favoriteOnly;el('favorites').setAttribute('aria-pressed',favoriteOnly);renderCards()};
el('shoppingNav').onclick=()=>location.hash='#boodschappenlijst';
window.addEventListener('hashchange',route);
fetch('recepten.json',{cache:'no-cache'}).then(r=>{if(!r.ok)throw Error('Kan recepten niet laden');return r.json()}).then(data=>{
 if(!Array.isArray(data))throw Error('Ongeldige recepten');
 recipes=data;
 if(favorites.has('bolognese')||favorites.has('pasta-basilico')){
  favorites.add('pasta-rundergehakt-groenten');favorites.delete('bolognese');favorites.delete('pasta-basilico');save(STORAGE.fav,[...favorites]);
 }
 [...new Set(data.map(x=>x.category||'Overig'))].sort((a,b)=>a.localeCompare(b,'nl')).forEach(c=>el('category').add(new Option(c,c)));
 basketCount();route();
}).catch(e=>{el('count').innerHTML='<span class="error">De recepten konden niet worden geladen. Probeer de pagina opnieuw.</span>';console.error(e)});
</script>
</body>
</html>
